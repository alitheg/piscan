[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "piscan"
dynamic = ["version"]
description = "Pulls scans off a Doxie Go X2 and sends them to Paperless-ngx"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.142.2,<1",
    # Capped explicitly: it is the layer that has been changing its API.
    "starlette>=1.7.0,<2",
    "uvicorn>=0.54.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "httpx>=0.28.1",
    "pillow>=12.3.0",
    "img2pdf>=0.6.3",
    "pikepdf>=10.16.0",
]

[project.optional-dependencies]
# httpx2 is what starlette's TestClient wants now; without it every run warns.
dev = ["pytest", "ruff", "build", "httpx2"]

[project.scripts]
piscan = "piscan.cli:main"

[tool.hatch.version]
path = "src/piscan/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/piscan"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
